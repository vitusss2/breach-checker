name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  POSTGRES_DB: breachdb
  POSTGRES_USER: breach
  POSTGRES_PASSWORD: haslo-tylko-dla-ci

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Start backend, database, cache and logging service
        run: docker compose up -d --build --wait backend log redis
      - name: Run backend tests
        run: docker compose exec -T backend pytest -v
      - name: Show logs on failure
        if: failure()
        run: docker compose logs

  build-and-push:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set backend image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/breach-checker-backend" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build production backend
        run: docker build -t "$IMAGE:$GITHUB_SHA" backend
      - name: Skan obrazu backendu przez Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.0 image \
            --scanners vuln --severity CRITICAL \
            --ignore-unfixed --exit-code 1 \
            "$IMAGE:$GITHUB_SHA"
      - name: Publish backend
        run: docker push "$IMAGE:$GITHUB_SHA"

  build-frontend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and lint frontend
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/breach-checker-frontend:$GITHUB_SHA"
          docker build -t "$image" frontend
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Publish frontend
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"

  verify:
    needs: [build-and-push, build-frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select backend image from this commit
        run: |
          echo "FRONTEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/breach-checker-frontend:$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/breach-checker-backend:$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull published backend
        run: docker compose pull backend frontend
      - name: Start production stack
        run: docker compose up -d --wait
      - name: Smoke test through frontend
        run: |
          curl --fail -sS http://localhost:8080/ > /dev/null
          curl --fail -sS http://localhost:8080/api/health
          curl --fail -sS -X POST -H "Content-Type: application/json" \
            -d '{"hash":"7c4a8d09ca3762af61e59520943dc26494f8941b"}' \
            http://localhost:8080/api/check | grep '"found":true'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs

  promote:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Promote verified images
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for service in backend frontend; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/breach-checker-$service"
            docker pull "$image:$GITHUB_SHA"
            docker tag "$image:$GITHUB_SHA" "$image:latest"
            docker push "$image:latest"
          done
